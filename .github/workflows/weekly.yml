name: Weekly AI intelligence briefing

on:
  schedule:
    # Monday 08:00 Asia/Singapore (UTC+8, no DST).
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Edition date (YYYY-MM-DD); blank uses today"
        required: false
        type: string
      regenerate_edition:
        description: "Replace an existing date using the current selection profile"
        required: false
        default: false
        type: boolean
      max_topics:
        description: "Maximum approved topics (1-2)"
        required: false
        default: 2
        type: number

permissions:
  contents: write

concurrency:
  group: weekly-ai-tech-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEURAL_ALPHA_SELECTION_CONTEXT_JSON: ${{ secrets.NEURAL_ALPHA_SELECTION_CONTEXT_JSON }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install '.[dev]'

      - name: Test
        run: pytest -q

      - name: Generate edition
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
          INPUT_REGENERATE: ${{ inputs.regenerate_edition }}
          INPUT_MAX_TOPICS: ${{ inputs.max_topics }}
        run: |
          if [[ -z "$NEURAL_ALPHA_SELECTION_CONTEXT_JSON" ]]; then
            echo "::error::Missing encrypted secret NEURAL_ALPHA_SELECTION_CONTEXT_JSON"
            exit 1
          fi
          args=(
            --output-root editions
            --max-topics "${INPUT_MAX_TOPICS:-2}"
            --minimum-score 70
          )
          if [[ -n "$INPUT_AS_OF" ]]; then args+=(--as-of "$INPUT_AS_OF"); fi
          edition_date="${INPUT_AS_OF:-$(date -u +%F)}"
          edition_dir="editions/$edition_date"
          if [[ -f "$edition_dir/manifest.json" && "$INPUT_REGENERATE" != "true" ]]; then
            echo "Reusing approved edition at $edition_dir"
          else
            edition_dir=$(weekly-tech-update "${args[@]}")
          fi
          echo "EDITION_DIR=$edition_dir" >> "$GITHUB_ENV"
          echo "EDITION_DATE=$(basename "$edition_dir")" >> "$GITHUB_ENV"

      - name: Persist approved edition
        run: |
          git config user.name "weekly-tech-update[bot]"
          git config user.email "weekly-tech-update[bot]@users.noreply.github.com"
          git add "$EDITION_DIR"
          if git diff --cached --quiet; then
            echo "No new approved edition to commit"
          else
            git commit -m "weekly: approved AI update $EDITION_DATE"
            git push
          fi

      - name: Upload edition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-${{ env.EDITION_DATE || inputs.as_of || github.run_id }}
          path: editions/
          if-no-files-found: warn
          retention-days: 30
