name: Weekly AI tech update

on:
  schedule:
    # Monday 08:00 Asia/Singapore (UTC+8, no DST).
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Edition date (YYYY-MM-DD); blank uses today"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-ai-tech-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4' }}
      OPENAI_VIDEO_MODEL: ${{ vars.OPENAI_VIDEO_MODEL || vars.OPENAI_MODEL || 'gpt-5.4' }}
      OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts' }}
      OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE || 'cedar' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install
        run: |
          pip install '.[dev]'
          npm ci

      - name: Test
        run: |
          pytest -q
          npm run typecheck

      - name: Generate edition
        env:
          INPUT_AS_OF: ${{ inputs.as_of }}
        run: |
          args=(--output-root editions --max-topics 3 --minimum-score 70)
          if [[ -n "$INPUT_AS_OF" ]]; then args+=(--as-of "$INPUT_AS_OF"); fi
          edition_date="${INPUT_AS_OF:-$(date -u +%F)}"
          edition_dir="editions/$edition_date"
          if [[ -f "$edition_dir/manifest.json" ]]; then
            echo "Reusing approved edition at $edition_dir"
          else
            edition_dir=$(weekly-tech-update "${args[@]}")
          fi
          echo "EDITION_DIR=$edition_dir" >> "$GITHUB_ENV"
          echo "EDITION_DATE=$(basename "$edition_dir")" >> "$GITHUB_ENV"

      - name: Generate video plan and OpenAI TTS
        run: |
          weekly-tech-video prepare \
            --edition-dir "$EDITION_DIR" \
            --public-root public \
            --repository "$GITHUB_REPOSITORY"

      - name: Render Remotion video
        run: |
          video_path="$EDITION_DIR/ai-weekly-$EDITION_DATE-zh.mp4"
          npm run render:video -- \
            "$video_path" \
            --props="$EDITION_DIR/remotion-props.json" \
            --codec=h264 \
            --crf=18 \
            --audio-bitrate=192k \
            --concurrency=2 \
            --log=error
          echo "VIDEO_PATH=$video_path" >> "$GITHUB_ENV"

      - name: Finalize video metadata and link
        run: |
          weekly-tech-video finalize \
            --edition-dir "$EDITION_DIR" \
            --video-path "$VIDEO_PATH" \
            --repository "$GITHUB_REPOSITORY"

      - name: Commit edition
        run: |
          git config user.name "weekly-tech-update[bot]"
          git config user.email "weekly-tech-update[bot]@users.noreply.github.com"
          git add editions
          if git diff --cached --quiet; then
            echo "No new edition to commit"
          else
            git commit -m "weekly: AI update $(date -u +%F)"
            git push
          fi

      - name: Publish teaching video release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="weekly-$EDITION_DATE"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$VIDEO_PATH" --clobber
          else
            gh release create "$tag" "$VIDEO_PATH" \
              --target main \
              --title "AI Weekly · $EDITION_DATE" \
              --notes "Source-grounded weekly AI teaching video. Narration is AI-generated."
          fi

      - name: Upload edition and video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-${{ env.EDITION_DATE }}
          path: editions/
          if-no-files-found: warn
          retention-days: 30
